<svg width="474" height="585" viewBox="0 0 474 585" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shelfd owner creator badge crown only">
  <defs>
    <linearGradient id="goldBorder" x1="237" y1="34" x2="237" y2="553" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF29A"/>
      <stop offset="0.42" stop-color="#F0C743"/>
      <stop offset="1" stop-color="#C88A16"/>
    </linearGradient>
    <linearGradient id="redFill" x1="106" y1="83" x2="377" y2="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF001B"/>
      <stop offset="0.48" stop-color="#E00012"/>
      <stop offset="1" stop-color="#A90000"/>
    </linearGradient>
    <radialGradient id="redGlow" cx="37%" cy="23%" r="65%">
      <stop offset="0" stop-color="#FF3446" stop-opacity="0.45"/>
      <stop offset="0.55" stop-color="#F00016" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#8B0000" stop-opacity="0.30"/>
    </radialGradient>
    <linearGradient id="crownGold" x1="237" y1="123" x2="237" y2="345" gradientUnits="userSpaceOnUse">
