  <!-- outer gold shield -->
  <path d="M237 34 L433 96 Q441 99 441 108 V321 C441 421 360 497 237 552 C114 497 33 421 33 321 V108 Q33 99 41 96 Z" fill="url(#goldBorder)"/>

  <!-- inner red shield -->
