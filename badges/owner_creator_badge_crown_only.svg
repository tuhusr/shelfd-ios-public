      <stop offset="0.45" stop-color="#FFE26A"/>
      <stop offset="1" stop-color="#D89B1C"/>
    </linearGradient>
    <linearGradient id="crownShine" x1="155" y1="145" x2="315" y2="323" gradientUnits="userSpaceOnUse">
