  <path d="M237 49 L423 109 V319 C423 409 351 481 237 535 C123 481 51 409 51 319 V109 Z" fill="url(#redGlow)"/>

  <!-- inner gold highlight edge -->
  <path d="M237 49 L423 109 V319 C423 409 351 481 237 535 C123 481 51 409 51 319 V109 Z" fill="none" stroke="#FFE878" stroke-width="2" opacity="0.45"/>

  <!-- single owner crown, replacing the old C + small crown -->
