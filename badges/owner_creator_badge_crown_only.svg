    <path d="M144 315 L116 171 L199 229 L237 123 L275 229 L358 171 L330 315 C276 299 198 299 144 315 Z" fill="url(#crownGold)"/>
    <path d="M144 315 C198 299 276 299 330 315 L318 346 C269 334 205 334 156 346 Z" fill="url(#crownGold)"/>
    <path d="M144 315 L116 171 L199 229 L237 123 L275 229 L358 171 L330 315 C276 299 198 299 144 315 Z" fill="url(#crownShine)" opacity="0.45"/>
    <path d="M144 315 L116 171 L199 229 L237 123 L275 229 L358 171 L330 315 C276 299 198 299 144 315 Z" fill="none" stroke="#FFF7B0" stroke-width="3" opacity="0.78"/>
    <path d="M156 346 C205 334 269 334 318 346" fill="none" stroke="#B87510" stroke-width="4" opacity="0.28"/>
