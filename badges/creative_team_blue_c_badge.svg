<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Creative Team C badge">
  <defs>
    <radialGradient id="blueFill" cx="36%" cy="28%" r="76%">
      <stop offset="0" stop-color="#5DB7FF"/>
      <stop offset="0.42" stop-color="#1976E8"/>
      <stop offset="0.78" stop-color="#0D3E9C"/>
      <stop offset="1" stop-color="#082B72"/>
    </radialGradient>

    <linearGradient id="goldRing" x1="235" y1="118" x2="789" y2="906" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B6"/>
      <stop offset="0.28" stop-color="#E8A838"/>
      <stop offset="0.62" stop-color="#B8791F"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>

    <linearGradient id="innerShine" x1="330" y1="150" x2="710" y2="730" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>

    <filter id="badgeShadow" x="-18%" y="-18%" width="136%" height="136%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.28"/>
    </filter>

    <filter id="letterShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#001A45" flood-opacity="0.38"/>
    </filter>
  </defs>

  <circle cx="512" cy="512" r="430" fill="url(#blueFill)" filter="url(#badgeShadow)"/>
  <circle cx="512" cy="512" r="430" fill="none" stroke="url(#goldRing)" stroke-width="48"/>
  <circle cx="512" cy="512" r="372" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="8"/>
  <circle cx="512" cy="512" r="356" fill="url(#innerShine)" opacity="0.72"/>

  <text x="512" y="620"
        text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="355"
        font-weight="900"
        letter-spacing="-10"
        fill="#FFFFFF"
        filter="url(#letterShadow)">C</text>

