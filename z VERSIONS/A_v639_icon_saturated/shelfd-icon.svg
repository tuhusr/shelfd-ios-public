<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shelfd app icon (v639) — saturated flat redesign.
  Pure flat fills, no gradients/glows/shadows. Billboard-grade colors.

  Design choices:
   - Background: solid #181c20 (matches app dark mode)
   - Gold half:  solid #fbbf24 (saturated warm amber, "Oscar gold" presence)
   - Purple half: solid #a78bfa stroke (lighter lavender pops on dark bg)
   - Stroke:     36px on a 1024 canvas (~3.5%, weight-balanced vs. solid gold)
   - Closed seam: 36px vertical bar fuses the two halves cleanly

  Geometry: classic five-point star, mathematically precise.
   - Outer points at radius 380 from center (512, 540)
   - Inner notches at radius ≈ 145.18 (≈ outer × sin(18°)/sin(54°))
   - Outer points at angles 90°, 162°, 234°, 306°, 18° (top counterclockwise)
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="geometricPrecision">
  <defs>
    <path id="starPath" d="
      M 512 160
      L 599.42 415.61
      L 870 415.61
      L 651.29 573.29
      L 734.72 832.18
      L 512 672
      L 289.28 832.18
      L 372.71 573.29
      L 154 415.61
      L 424.58 415.61
      Z"/>

    <clipPath id="leftHalf">
      <rect x="0" y="0" width="512" height="1024"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="512" y="0" width="512" height="1024"/>
    </clipPath>
  </defs>

  <!-- Solid background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#181c20"/>

  <!-- Gold left half — solid fill -->
  <g clip-path="url(#leftHalf)">
    <use href="#starPath" fill="#fbbf24"/>
  </g>

  <!-- Purple right half — solid stroke, miter joins keep the points sharp -->
  <g clip-path="url(#rightHalf)">
    <use href="#starPath"
         fill="none"
         stroke="#a78bfa"
         stroke-width="36"
         stroke-linejoin="miter"
         stroke-miterlimit="6"/>
  </g>

  <!-- Closed seam: 36px purple bar from top point to bottom V notch -->
  <g clip-path="url(#rightHalf)">
    <line x1="512" y1="160" x2="512" y2="672"
          stroke="#a78bfa"
          stroke-width="36"
          stroke-linecap="square"/>
  </g>
</svg>
