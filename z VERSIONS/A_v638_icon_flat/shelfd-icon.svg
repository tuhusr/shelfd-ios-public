<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shelfd app icon (v638) — flat redesign.
  No radial gradients, no glows, no highlight overlays. Solid fills only.
   - Background: solid #181c20 (matches app dark mode)
   - Gold half: solid #f5d27a (matches the in-app star rating gold)
   - Purple half: solid #8b5cf6 outline stroke (matches the in-app accent)
   - Closed seam — gold's right edge meets the purple stroke cleanly.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!--
      Star path. Classic five-point star.
      Centered at (512, 540) with outer radius 380, inner radius ~145.
    -->
    <path id="starPath" d="
      M 512 160
      L 599.42 415.61
      L 870 415.61
      L 651.29 573.29
      L 734.72 832.18
      L 512 672
      L 289.28 832.18
      L 372.71 573.29
      L 154 415.61
      L 424.58 415.61
      Z"/>

    <clipPath id="leftHalf">
      <rect x="0" y="0" width="512" height="1024"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="512" y="0" width="512" height="1024"/>
    </clipPath>
  </defs>

  <!-- Background: flat solid -->
  <rect x="0" y="0" width="1024" height="1024" fill="#181c20"/>

  <!-- Gold left half — solid fill, no highlight -->
  <g clip-path="url(#leftHalf)">
    <use href="#starPath" fill="#f5d27a"/>
  </g>

  <!-- Purple right half — solid stroke -->
  <g clip-path="url(#rightHalf)">
    <use href="#starPath"
         fill="none"
         stroke="#8b5cf6"
         stroke-width="28"
         stroke-linejoin="miter"
         stroke-miterlimit="10"/>
  </g>

  <!-- Closed seam: vertical bar fusing gold's right edge to the purple outline -->
  <g clip-path="url(#rightHalf)">
    <line x1="512" y1="160" x2="512" y2="672"
          stroke="#8b5cf6"
          stroke-width="28"
          stroke-linecap="square"/>
  </g>
</svg>
