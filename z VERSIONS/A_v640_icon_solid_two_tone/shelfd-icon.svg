<?xml version="1.0" encoding="UTF-8"?>
<!--
  Shelfd app icon (v640) — solid two-tone.
  Both halves are now SOLID FILLED. No stroke, no miter extensions, no
  geometric mismatch between halves. Both share the exact same star path
  clipped down the vertical centerline, so the two colored shapes are
  pixel-perfect mirror images.

   - Background: solid #181c20 (matches app dark mode)
   - Gold half:  solid #fbbf24 (saturated warm amber)
   - Purple half: solid #a78bfa (lavender violet)

  Geometry: classic five-point star, mathematically precise.
   - Outer points at radius 380 from center (512, 540)
   - Inner notches at radius ≈ 145 (≈ outer × sin(18°)/sin(54°))
   - Outer points at angles 90°, 162°, 234°, 306°, 18°
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" shape-rendering="geometricPrecision">
  <defs>
    <path id="starPath" d="
      M 512 160
      L 599.42 415.61
      L 870 415.61
      L 651.29 573.29
      L 734.72 832.18
      L 512 672
      L 289.28 832.18
      L 372.71 573.29
      L 154 415.61
      L 424.58 415.61
      Z"/>

    <clipPath id="leftHalf">
      <rect x="0" y="0" width="512" height="1024"/>
    </clipPath>
    <clipPath id="rightHalf">
      <rect x="512" y="0" width="512" height="1024"/>
    </clipPath>
  </defs>

  <!-- Solid background -->
  <rect x="0" y="0" width="1024" height="1024" fill="#181c20"/>

  <!-- Gold left half — solid fill -->
  <g clip-path="url(#leftHalf)">
    <use href="#starPath" fill="#fbbf24"/>
  </g>

  <!-- Purple right half — solid fill (mirror of left, perfect symmetry) -->
  <g clip-path="url(#rightHalf)">
    <use href="#starPath" fill="#a78bfa"/>
  </g>
</svg>
